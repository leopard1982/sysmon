name: Build .deb

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 python3-psutil lintian desktop-file-utils
      - name: Syntax check
        run: python3 -m py_compile htop_widget.py
      - name: Build package
        run: ./scripts/build-deb.sh
      - name: Validate desktop files
        run: |
          desktop-file-validate packaging/usr/share/applications/desktop-htop.desktop \
            packaging/etc/xdg/autostart/desktop-htop.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-htop-deb
          path: dist/*.deb
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
